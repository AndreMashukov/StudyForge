# Release pipeline — replaces firebase-hosting-merge.yml.
# Design: docs/adr/009-llm-proposed-release-plan.md · scripts/release/README.md
#
#   pull_request → main : plan only; posts the Release plan as a sticky PR comment
#   push → main         : test → plan → deploy (unattended)
#   workflow_dispatch   : same as push; deploy_all=true skips the LLM and ships everything
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Skip the LLM planner and deploy web, rules, indexes and every function (pending tagged migrations still run)'
        type: boolean
        default: false

# Releases queue — never cancel a run that may be mid-migration. PR previews cancel each other.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin below 22.23 — firebase-tools OAuth fails with "Premature close" on newer Node (nodejs/node#63989)
  NODE_VERSION: '22.22.0'
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'
  RELEASE_FIREBASE_PROJECT: study-forge-202604

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' # PRs are covered by ci.yml
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - uses: nrwl/nx-set-shas@v4

      - run: yarn install --frozen-lockfile --ignore-engines

      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: functions

      - run: yarn nx affected -t lint --parallel=3
      - run: yarn nx affected -t test --parallel=3
      - run: yarn nx affected -t typecheck --parallel=3

  plan:
    # Fork PRs get neither the Together key nor an OIDC token, so they get no preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read        # nx-set-shas: find the last successful run
      id-token: write      # WIF
      pull-requests: write # sticky plan comment
    outputs:
      web: ${{ steps.outputs.outputs.web }}
      rules: ${{ steps.outputs.outputs.rules }}
      functions: ${{ steps.outputs.outputs.functions }}
      iam: ${{ steps.outputs.outputs.iam }}
      migrations_pre: ${{ steps.outputs.outputs.migrations_pre }}
      migrations_post: ${{ steps.outputs.outputs.migrations_post }}
      workspace_agent_knowledge: ${{ steps.outputs.outputs.workspace_agent_knowledge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      # push/dispatch: base = commit of the last successful Release run on main (so a failed
      # release is re-planned next time). pull_request: base = merge base with main.
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main
          # Never silently fall back to HEAD~1 — that would skip changes from earlier failed releases.
          # With no successful Release run on record, dispatch with deploy_all=true instead.
          error-on-no-successful-workflow: true

      - run: yarn install --frozen-lockfile --ignore-engines

      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: functions

      - name: Check release pipeline code
        run: yarn release:typecheck && yarn release:test

      - name: Build functions bundle (for export discovery)
        run: yarn nx run functions:build

      # The plan job is read-only for every event: preview SA (functions list, ledger, secret names).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_PREVIEW_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Collect release facts
        env:
          DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all && '--deploy-all' || '' }}
        run: yarn tsx scripts/release/facts.ts --base "$NX_BASE" --head "$NX_HEAD" --out .release/facts.json $DEPLOY_ALL

      - name: Plan release (Together AI · MiniMax M3.1 Flash)
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          PREVIEW: ${{ github.event_name == 'pull_request' && '--preview' || '' }}
        run: yarn tsx scripts/release/plan.ts --facts .release/facts.json --out .release/plan.json --summary .release/plan.md $PREVIEW

      - name: Job summary
        if: always() && hashFiles('.release/plan.md') != ''
        run: cat .release/plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: release-plan
          path: .release/plan.md

      - id: outputs
        if: github.event_name != 'pull_request'
        run: yarn --silent tsx scripts/release/execute.ts outputs --plan .release/plan.json

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.release/plan.json') != ''
        with:
          name: release-plan
          path: .release/
          # .release/ is a dot-directory; upload-artifact >= 4.4 skips hidden paths unless told otherwise.
          include-hidden-files: true
          # The deploy job can't run without the plan — fail here, not with a warning.
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [test, plan]
    if: github.event_name != 'pull_request' && needs.test.result == 'success' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - run: yarn install --frozen-lockfile --ignore-engines

      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: functions

      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .release/

      # Build everything before touching production, so a build failure deploys nothing.
      - name: Build functions
        if: needs.plan.outputs.functions == 'true'
        run: yarn nx run functions:build

      - name: Build web app
        if: needs.plan.outputs.web == 'true'
        run: yarn nx build web --configuration=production
        env:
          NX_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NX_PUBLIC_FIREBASE_API_KEY }}
          NX_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NX_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NX_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NX_PUBLIC_FIREBASE_PROJECT_ID }}
          NX_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NX_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NX_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NX_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NX_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NX_PUBLIC_FIREBASE_APP_ID }}
          NX_PUBLIC_GEMINI_API_KEY: ${{ secrets.NX_PUBLIC_GEMINI_API_KEY }}
          NX_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.NX_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}

      # Deploy identity — WIF trust only accepts refs/heads/main.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # A re-run of an older run would deploy its older commit over a newer release. Fail (not skip:
      # a skipped run counts as successful and would move the diff base past undeployed changes).
      - name: Refuse a superseded revision
        run: |
          git fetch --quiet --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::main is at ${tip}, this run is for ${GITHUB_SHA}. The run for the newer commit deploys these changes too."
            exit 1
          fi

      # Strict order; any failure stops every later step. No automatic rollback.
      - name: 1. Rules and indexes (indexes not awaited)
        if: needs.plan.outputs.rules == 'true'
        run: yarn --silent tsx scripts/release/execute.ts rules --plan .release/plan.json

      - name: 2. Migrations (pre-functions)
        if: needs.plan.outputs.migrations_pre == 'true'
        run: yarn --silent tsx scripts/release/execute.ts migrations --phase pre-functions --plan .release/plan.json

      - name: 3. Functions
        if: needs.plan.outputs.functions == 'true'
        run: yarn --silent tsx scripts/release/execute.ts functions --plan .release/plan.json

      - name: 4. IAM grants
        if: needs.plan.outputs.iam == 'true'
        run: yarn --silent tsx scripts/release/execute.ts iam --plan .release/plan.json

      - name: 5. Migrations (post-functions)
        if: needs.plan.outputs.migrations_post == 'true'
        run: yarn --silent tsx scripts/release/execute.ts migrations --phase post-functions --plan .release/plan.json

      - name: 6. Publish and re-index Platform agent knowledge
        if: needs.plan.outputs.workspace_agent_knowledge == 'true'
        run: yarn --silent tsx scripts/release/execute.ts workspace-agent-knowledge --plan .release/plan.json
        env:
          RELEASE_WORKSPACE_KNOWLEDGE_DOCUMENT_ID: ${{ secrets.RELEASE_WORKSPACE_KNOWLEDGE_DOCUMENT_ID }}
          RELEASE_WORKSPACE_KNOWLEDGE_USER_ID: ${{ secrets.RELEASE_WORKSPACE_KNOWLEDGE_USER_ID }}

      - name: 7. Web (Hosting)
        if: needs.plan.outputs.web == 'true'
        run: yarn --silent tsx scripts/release/execute.ts hosting --plan .release/plan.json

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release ${{ job.status }}"
            echo
            cat .release/plan.md
          } >> "$GITHUB_STEP_SUMMARY"
